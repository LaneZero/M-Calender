<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101b2e"><meta name="description" content="A simple bilingual recurring activity tracker"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css"><title>M Calendar | ام کالندر</title></head>
<body><div class="shell"><header class="top"><div class="brand"><span class="mark">◉</span><div><strong>M Calendar</strong><small id="tagline"></small></div></div><div class="settings"><label><span id="language-label"></span><select id="language"><option value="fa">فارسی</option><option value="en">English</option></select></label><label><span id="calendar-label"></span><select id="calendar-system"><option value="persian">شمسی · Persian</option><option value="gregory">میلادی · Gregorian</option></select></label></div></header><nav class="app-nav" aria-label="Main navigation"><button id="nav-tasks" class="nav-button" type="button" data-view="tasks" aria-current="page"></button><button id="nav-help" class="nav-button" type="button" data-view="help"></button><button id="nav-donate" class="nav-button" type="button" data-view="donate"></button></nav><main><div id="view-tasks"><section class="hero"><div><p class="eyebrow" id="eyebrow"></p><h1 id="heading"></h1><p id="subtitle"></p></div><button id="add-button" class="primary"></button></section><section class="notification-controls" aria-live="polite"><button type="button" id="notification-permission" class="secondary"></button><button type="button" id="notification-test" class="secondary" hidden></button><span id="notification-status" class="hint"></span></section><p id="action-feedback" class="action-feedback" role="status" aria-live="polite" hidden></p><section class="stats" id="stats"></section><div class="layout"><section class="panel"><div class="section-heading"><h2 id="tasks-heading"></h2><select id="task-filter"><option value="all"></option><option value="due"></option><option value="upcoming"></option></select></div><div id="task-list" class="task-list"></div></section><aside class="panel"><div class="section-heading"><h2 id="calendar-heading"></h2><div class="month-actions"><button id="prev-month" class="icon-button" aria-label="Previous month">‹</button><strong id="month-title"></strong><button id="next-month" class="icon-button" aria-label="Next month">›</button></div></div><div id="weekdays" class="calendar-grid weekdays"></div><div id="calendar-grid" class="calendar-grid"></div><p class="hint" id="calendar-hint"></p><div class="tools"><button id="export-button" class="secondary"></button><label class="secondary file-button" for="import-file" id="import-label"></label><input id="import-file" type="file" accept="application/json,.json" hidden></div></aside></div></div><section id="view-help" class="info-view panel" hidden><h1 id="help-heading"></h1><p id="help-intro" class="info-lead"></p><div id="help-steps" class="info-content"></div><div id="help-notes" class="info-content"></div></section><section id="view-donate" class="info-view panel" hidden><h1 id="donate-heading"></h1><p id="donate-intro" class="info-lead"></p><div id="donate-details" class="info-content"></div></section></main><footer><span>M Calendar · <span id="app-version">v0.2.2</span> · Offline-first PWA</span><span id="privacy"></span></footer></div>
<dialog id="editor"><form method="dialog" id="task-form"><div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" class="icon-button" id="close-dialog">×</button></div><label id="name-label" for="task-name"></label><input id="task-name" maxlength="100" required><label id="category-label" for="task-category"></label><select id="task-category"><option value="general"></option><option value="health"></option><option value="work"></option><option value="personal"></option></select><label id="repeat-label"></label><div class="repeat-row"><input id="repeat-every" type="number" min="1" max="365" value="2" required><select id="repeat-unit"><option value="day"></option><option value="week"></option><option value="month"></option></select></div><label id="schedule-label"></label><select id="schedule-mode"><option value="fixed"></option><option value="completion"></option></select><label id="start-label"></label><button type="button" id="pick-start" class="date-picker-button"></button><div id="date-picker" class="date-picker" hidden><div class="picker-heading"><button type="button" id="picker-prev">‹</button><strong id="picker-month"></strong><button type="button" id="picker-next">›</button></div><div id="picker-weekdays" class="calendar-grid weekdays"></div><div id="picker-days" class="calendar-grid"></div></div><label id="end-label"></label><div class="end-presets" role="group" aria-label="End date presets"><button type="button" id="end-none" class="secondary"></button><button type="button" id="end-month" class="secondary"></button><button type="button" id="end-year" class="secondary"></button></div><button type="button" id="pick-end" class="date-picker-button"></button><p class="hint" id="end-summary"></p><label id="time-label" for="task-time"></label><input id="task-time" type="time" value="09:00"><div class="reminder-editor"><label class="reminder-toggle"><input type="checkbox" id="reminder-enabled"><span id="reminder-enabled-label"></span></label><span id="reminder-offset-label" class="reminder-offset-label"></span><div id="reminder-offset" class="reminder-choices" role="group" aria-labelledby="reminder-offset-label"><label class="reminder-choice"><input type="radio" name="reminder-offset" value="0" checked><span class="reminder-choice-text"></span></label><label class="reminder-choice"><input type="radio" name="reminder-offset" value="5"><span class="reminder-choice-text"></span></label><label class="reminder-choice"><input type="radio" name="reminder-offset" value="15"><span class="reminder-choice-text"></span></label><label class="reminder-choice"><input type="radio" name="reminder-offset" value="30"><span class="reminder-choice-text"></span></label><label class="reminder-choice"><input type="radio" name="reminder-offset" value="60"><span class="reminder-choice-text"></span></label></div><p id="reminder-hint" class="hint"></p></div><p class="hint" id="schedule-explanation"></p><div class="dialog-actions"><button type="button" class="secondary" id="cancel-button"></button><button class="primary" type="submit" id="save-button"></button></div></form></dialog>
<script type="module" src="./src.js"></script></body></html>
